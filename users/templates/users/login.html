<!DOCKTYPE HTML>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Sign in</title>


    <!-- 1. Завантажуємо тег static -->
        {% load static %}

    <!-- 2. Підключаємо CSS файл -->
    <link rel="stylesheet" href="{% static 'users/css/style.login.css' %}">
</head>

<body>

    <div class="auth-card">
        <div class="brand-logo">Music DB </div>
        <h2>Welcome</h2>


        <form method="post">
            {% csrf_token %}

            <!-- 3. Загальні помилки форми-->

            {% if form.non_field_errors %}
                    <div class="form-errors">
                        {{form.non_field_errors}}
                    </div>
            {%endif%}


            {% for field in form %}
                <div class="form-group">
                    {{field}}
                    {% if field.errors %}
                        <div style="color: red; font-size: 12px;">
                            {{ field.errors.0 }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-submit">Continue</button>
        </form>
    </div>

</body>
</html>
