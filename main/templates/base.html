{% load static %}
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Data Base</title>
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
</head>
<body>
    <!-- Шапка -->
    <header class="navbar">
        <div class="logo">Music Data Base</div>
        <nav class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'users:profile' %}" class="btn-profile">{{ user.username }}</a>
            {% else %}
                <a href="{% url 'users:login' %}" class="btn-login">Login</a>
            {% endif %}
        </nav>
    </header>

    <!-- Головний контейнер -->
    <main class="main-container">
        {% block content %}
        <!-- Сюди Django автоматично підставить контент потрібної сторінки -->
        {% endblock %}
    </main>
</body>
</html>
